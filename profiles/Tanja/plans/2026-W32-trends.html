<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainingsdaten 2026-W32</title>
  <link rel="stylesheet" href="../../../plan-format/training-plan.css">
</head>
<body>
  <main>
    <header>
      <h1>Trainingsdaten 2026-W32</h1>
      <p class="eyebrow">Datenstand 2026-07-31</p>
    </header>

    <section class="trends" aria-label="Zeitreihen">
      <h2>Trends</h2>

      <div class="trend-board trend-board-top">
        <div class="trend-group">
          <h3>Performance (12 Monate)</h3>
          <div class="trend-grid stack">
            <img src="assets/2026-W32/performance_thresholds.svg" alt="Swim-, Bike- und Run-Thresholds der letzten 12Monate">
            <img src="assets/2026-W32/performance_vo2max.svg" alt="Bike- und Run-VO2max der letzten 12Monate">
          </div>
        </div>

        <div class="trend-group">
          <h3>Belastung (90 Tage)</h3>
          <div class="trend-grid stack">
            <img src="assets/2026-W32/load_atl_ctl.svg" alt="Tages-TSS, ATL und CTL der letzten 90Tage">
            <img src="assets/2026-W32/load_tsb.svg" alt="TSB der letzten 90Tage">
          </div>
        </div>
      </div>

      <div class="efficiency-section">
        <h3>Effizienz (90 Tage)</h3>
        <div class="trend-grid efficiency-weekly-row">
          <img class="efficiency-weekly" src="assets/2026-W32/efficiency_weekly.svg" alt="Wöchentlicher Trend der Bike-Power und Run-GAP bei 130 und 155 bpm mit Fehlerbalken">
          <img src="assets/2026-W32/weekly_long_sessions.svg" alt="Längste Bike- und Run-Session pro Woche der letzten 12 Wochen">
        </div>
        <div class="trend-grid efficiency-sport-row">
          <img src="assets/2026-W32/efficiency_bike.svg" alt="Bike-Power gegen Herzfrequenz der letzten 90 Tage, mit lokalen Fits bei 130 und 155 bpm">
          <img src="assets/2026-W32/efficiency_run.svg" alt="Run-GAP gegen Herzfrequenz der letzten 90 Tage, mit lokalen Fits bei 130 und 155 bpm">
        </div>
      </div>

      <div class="trend-middle">
        <div class="trend-middle-top">
          <img src="assets/2026-W32/weekly_duration.svg" alt="Wochenumfang pro Sportart der letzten 12 Wochen">
          <img src="assets/2026-W32/weekly_tss.svg" alt="Wochen-TSS pro Sportart der letzten 12 Wochen">
        </div>
        <div class="trend-middle-bottom">
          <img class="trend-wide" src="assets/2026-W32/weekly_zones.svg" alt="Zeit und Distanz in Zonen der letzten abgeschlossenen Woche">
        </div>
      </div>

      <div class="trend-board trend-board-bottom">
        <div class="trend-group">
          <h3>Readiness (90 Tage)</h3>
          <div class="trend-grid stack">
            <img src="assets/2026-W32/readiness_hrv.svg" alt="HRV mit Tageswert, 7-Tage-Trend und 90-Tage-Korridor">
            <img src="assets/2026-W32/readiness_sleep_resting_hr.svg" alt="Schlafdauer, Sleepscore und Ruhepuls der letzten 90Tage">
          </div>
        </div>

        <div class="trend-group">
          <h3>Alltag (90 Tage)</h3>
          <div class="trend-grid stack">
            <img src="assets/2026-W32/body_weight.svg" alt="Gewicht und Körperfett mit Tageswerten und 7-Tage-Mitteln der letzten 90Tage">
            <img src="assets/2026-W32/body_steps.svg" alt="Schritte mit Tageswerten und 7-Tage-Mittel der letzten 90Tage">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
