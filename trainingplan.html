<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aktueller Trainingsplan</title>
  <link rel="icon" type="image/png" href="assets/calendar.png">
  <script>
    function isoWeekPlanPath(date) {
      const utcDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const day = utcDate.getUTCDay() || 7;
      utcDate.setUTCDate(utcDate.getUTCDate() + 4 - day);
      const year = utcDate.getUTCFullYear();
      const yearStart = new Date(Date.UTC(year, 0, 1));
      const week = Math.ceil((((utcDate - yearStart) / 86400000) + 1) / 7);
      return `plans/${year}-W${String(week).padStart(2, "0")}.html`;
    }

    const currentPlan = isoWeekPlanPath(new Date());
    window.location.replace(currentPlan);
    window.addEventListener("DOMContentLoaded", () => {
      const link = document.getElementById("current-plan-link");
      link.href = currentPlan;
      link.textContent = currentPlan;
    });
  </script>
</head>
<body>
  <p>Aktuellen Trainingsplan öffnen: <a id="current-plan-link" href="plans/2026-W24.html">plans/2026-W24.html</a></p>
</body>
</html>
